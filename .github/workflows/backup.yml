name: Nightly backup

# Off until the repository variable BACKUP_ENABLED is set to true and the secrets below exist.
on:
  schedule:
    - cron: '0 23 * * *' # 02:00 in Nairobi, before the 02:30 clean-up
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    name: Encrypted backup
    if: vars.BACKUP_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Build the backup tools
        run: docker build -t sauti-backup ops/backup

      - name: Back up
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
          BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          BACKUP_BUCKET: ${{ secrets.BACKUP_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_SECRET_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          docker run --rm \
            -e BACKUP_DATABASE_URL -e BACKUP_AGE_RECIPIENT -e BACKUP_S3_ENDPOINT -e BACKUP_BUCKET \
            -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION \
            sauti-backup
