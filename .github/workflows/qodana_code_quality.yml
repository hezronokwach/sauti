name: Qodana
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - staging # where work is merged first
      - main # the live branch

jobs:
  qodana:
    # Dependabot runs do not receive repository secrets, so QODANA_TOKEN would be empty
    # and the scan would fail without looking at the code.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}  # to check out the actual pull request commit, not the merge commit
          fetch-depth: 0  # a full history is required for pull request analysis
      - name: 'Qodana Scan'
        uses: JetBrains/qodana-action@v2026.2
        with:
          pr-mode: false
          upload-result: true  # keep the results file on the run, so findings can be read in GitHub
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN_1691855989 }}
          QODANA_ENDPOINT: 'https://qodana.cloud'