# Demonstration wording, not reviewed by a Swahili-speaking clinician.
# "kila baada ya saa nane" is used because "kila saa nane" can be heard as two o'clock.
line.ORAL=Meza {dose} ya {medicine}, {frequency}, {days}.
line.INHALED=Vuta {dose} ya {medicine}, {frequency}, {days}.
line.TOPICAL=Paka {dose} ya {medicine} kwenye ngozi, {frequency}, {days}.
line.IM=Utapewa {dose} ya {medicine} kwa sindano kwenye msuli, {frequency}, {days}.
line.IV=Utapewa {dose} ya {medicine} kwa sindano kwenye mshipa, {frequency}, {days}.
line.SC=Utapewa {dose} ya {medicine} kwa sindano chini ya ngozi, {frequency}, {days}.
dose={unit} {number}
days.one=kwa siku moja
days.many=kwa siku {number}
