# Demonstration wording, not clinically reviewed. A change is a new version folder.
line.ORAL=Take {dose} of {medicine}, {frequency}, {days}.
line.INHALED=Inhale {dose} of {medicine}, {frequency}, {days}.
line.TOPICAL=Apply {dose} of {medicine} to the skin, {frequency}, {days}.
line.IM=You will be given {dose} of {medicine} by injection into a muscle, {frequency}, {days}.
line.IV=You will be given {dose} of {medicine} by injection into a vein, {frequency}, {days}.
line.SC=You will be given {dose} of {medicine} by injection under the skin, {frequency}, {days}.
dose={number} {unit}
days.one=for one day
days.many=for {number} days
frequency.OD=once a day
frequency.BD=twice a day
frequency.TDS=three times a day
frequency.QID=four times a day
frequency.Q8H=every eight hours
frequency.STAT=once, right now
frequency.NOCTE=every night
frequency.AS_NEEDED=only when needed
unit.MG.one=milligram
unit.MG.many=milligrams
unit.MCG.one=microgram
unit.MCG.many=micrograms
