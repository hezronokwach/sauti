# Local development: Spring Boot starts compose.yaml (PostgreSQL and object storage)
# and connects to it automatically, so no database settings are needed here.
# Outside services (transcription, AI, registry, payments) use fake adapters in
# this profile; each adapter's switch is added here when the adapter is built.
spring:
  config:
    # Local keys and switches from the git-ignored .env, run from backend/ or the repository root.
    import: optional:file:../.env[.properties],optional:file:.env[.properties]
  docker:
    compose:
      lifecycle-management: start-only

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    ke.sauti.hms: debug

sauti:
  # fake by default. Set both to groq in .env to test with real speech: audio then leaves
  # this computer, so use only your own voice and never a real patient's.
  transcription:
    provider: ${TRANSCRIPTION_PROVIDER:fake}
  ai:
    provider: ${AI_PROVIDER:fake}
  storage:
    # SeaweedFS from compose.yaml by default; it runs without S3 authentication locally.
    # To try Cloudflare R2, set the STORAGE_ values in .env, use a test bucket made in the
    # Cloudflare dashboard, and set STORAGE_CREATE_BUCKET=false.
    endpoint: ${STORAGE_ENDPOINT:http://localhost:8333}
    bucket: ${STORAGE_BUCKET:sauti-audio}
    access-key: ${STORAGE_ACCESS_KEY:local-dev}
    secret-key: ${STORAGE_SECRET_KEY:local-dev} # gitleaks:allow
    region: ${STORAGE_REGION:us-east-1}
    create-bucket: ${STORAGE_CREATE_BUCKET:true}
  first-admin:
    # Local only, not secret: a fresh local database gets this admin. Change the
    # password at first login like any account; it is never used outside dev.
    email: admin@sauti.local
    password: Local-Dev-Admin-2026 # gitleaks:allow
  crypto:
    # Local only, not secret: fixed so data in the local database stays readable
    # across restarts. Every real deployment sets APP_ENCRYPTION_KEY and HASH_KEY.
    encryption-key: 2/cNRn5/KmEG1U+9IgMmz2IyJWQx3djKbAEUObgH7yI= # gitleaks:allow
    hash-key: jA5syg0IlB6gDyHdC+5yaz3pp09KDWr1Svrv9lxXC58= # gitleaks:allow
