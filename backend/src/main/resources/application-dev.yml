# Local development: Spring Boot starts compose.yaml (PostgreSQL and object storage)
# and connects to it automatically, so no database settings are needed here.
# Outside services (transcription, AI, registry, payments) use fake adapters in
# this profile; each adapter's switch is added here when the adapter is built.
spring:
  docker:
    compose:
      lifecycle-management: start-only

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    ke.sauti.hms: debug

sauti:
  storage:
    # SeaweedFS from compose.yaml; it runs without S3 authentication locally.
    endpoint: http://localhost:8333
    access-key: local-dev
    secret-key: local-dev # gitleaks:allow
    region: us-east-1
    create-bucket: true
  first-admin:
    # Local only, not secret: a fresh local database gets this admin. Change the
    # password at first login like any account; it is never used outside dev.
    email: admin@sauti.local
    password: Local-Dev-Admin-2026 # gitleaks:allow
  crypto:
    # Local only, not secret: fixed so data in the local database stays readable
    # across restarts. Every real deployment sets APP_ENCRYPTION_KEY and HASH_KEY.
    encryption-key: 2/cNRn5/KmEG1U+9IgMmz2IyJWQx3djKbAEUObgH7yI= # gitleaks:allow
    hash-key: jA5syg0IlB6gDyHdC+5yaz3pp09KDWr1Svrv9lxXC58= # gitleaks:allow
