# Automated tests: PostgreSQL comes from Testcontainers (@ServiceConnection),
# outside services use fake adapters, and time comes from a fixed clock once
# the clock bean exists. Docker Compose support is skipped in tests by default.
logging:
  level:
    ke.sauti.hms: debug

sauti:
  crypto:
    # Test only, not secret.
    encryption-key: 2siE80h7Mi8O18091FZBA/I3Wm6lZHtxmUe1C0d5ssk= # gitleaks:allow
    hash-key: OsFzZqqzZek8HPtPeU4t8Civx+RwrrjO8AhYkPMVZJM= # gitleaks:allow
  storage:
    # Tests that touch storage start SeaweedFS and override the endpoint.
    endpoint: http://localhost:1
    access-key: test
    secret-key: test # gitleaks:allow
    region: us-east-1
  rate-limit:
    # Tests make many requests from one address; RateLimitTest turns this on.
    enabled: false
  jobs:
    # Tests run the worker step by step.
    enabled: false
