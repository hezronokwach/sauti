# Shared settings for every profile.
# Secrets are never written here: use ${ENV_NAME} and list the name in .env.example.
spring:
  application:
    name: sauti-hms
  profiles:
    # Running from the IDE without SPRING_PROFILES_ACTIVE gives the dev profile.
    default: dev
  session:
    # Spring Session deletes a session after 15 minutes without a request.
    timeout: 15m
    jdbc:
      # Flyway creates the session tables (V3__spring_session.sql).
      initialize-schema: never
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks entities match it.
      ddl-auto: validate

server:
  servlet:
    session:
      cookie:
        http-only: true
        # Browsers accept Secure cookies on http://localhost, so dev still works.
        secure: true
        same-site: strict

logging:
  pattern:
    # Every log line carries the request id set by RequestIdFilter ("-" outside a request).
    correlation: "[%X{requestId:--}] "

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

sauti:
  # Environment variables that must be set before the app may start.
  # Each profile that talks to real services lists its own.
  required-env: []
  first-admin:
    # Used only while the staff table is empty; see FirstAdminSetup.
    email: ${FIRST_ADMIN_EMAIL:}
    password: ${FIRST_ADMIN_PASSWORD:}
    name: ${FIRST_ADMIN_NAME:Administrator}
  crypto:
    # 32 random bytes each, Base64 (openssl rand -base64 32). Never the same key twice.
    encryption-key: ${APP_ENCRYPTION_KEY:}
    hash-key: ${HASH_KEY:}
