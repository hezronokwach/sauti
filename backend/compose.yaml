# Local development services. Spring Boot starts these when the app runs in dev.
# Image tags are pinned; bump them deliberately, never use "latest".
# Credentials below are for local development only.
services:
  postgres:
    image: 'postgres:18.7'
    environment:
      - 'POSTGRES_DB=sauti'
      - 'POSTGRES_USER=sauti'
      - 'POSTGRES_PASSWORD=sauti-dev'
    ports:
      - '5432'
    volumes:
      - 'postgres-data:/var/lib/postgresql'

  # S3-compatible object storage for audio (phase 3).
  # SeaweedFS replaces MinIO, which no longer publishes container images.
  object-storage:
    image: 'chrislusf/seaweedfs:4.54'
    command: 'server -dir=/data -s3 -s3.port=8333'
    ports:
      - '8333:8333'
    volumes:
      - 'object-storage-data:/data'
    labels:
      org.springframework.boot.ignore: true

volumes:
  postgres-data:
  object-storage-data:
